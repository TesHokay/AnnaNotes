<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#fcf1f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161013" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AnnaNotes" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>AnnaNotes</title>
  </head>
  <body>
    <script>
      // Apply the saved theme before the app loads so the wrong theme never flashes.
      (function () {
        try {
          var t = localStorage.getItem('annanotes-theme') || 'system';
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var id = t === 'system' ? (dark ? 'dark' : 'pink') : t;
          var c = document.documentElement.classList;
          if (id === 'dark' || id === 'graphite') c.add('dark');
          if (id === 'light') c.add('theme-light');
          if (id === 'warm') c.add('theme-warm');
          if (id === 'graphite') c.add('theme-graphite');
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
